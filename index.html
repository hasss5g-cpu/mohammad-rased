<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b513d">
  <meta name="description" content="راصد — نظام احترافي لرصد غياب الطلاب والتأخر اليومي، يعمل دون إنترنت، مع تقارير وإحصاءات وحالات متكررة ورسائل واتساب.">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="راصد">
  <title>راصد — لرصد غياب الطلاب</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">تجاوز إلى المحتوى</a>
  <div id="app" class="app">
    <div class="boot-screen">
      <svg width="84" height="84" viewBox="0 0 64 64" role="img" aria-label="راصد">
        <defs>
          <linearGradient id="bootGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0f766e"/><stop offset=".55" stop-color="#0f6b4f"/><stop offset="1" stop-color="#0b4f3b"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="17" fill="url(#bootGrad)"/>
        <rect x="17" y="19" width="30" height="29" rx="5" fill="none" stroke="#fff" stroke-width="2.4"/>
        <path d="M17 27h30" stroke="#fff" stroke-width="2.4"/>
        <path d="M23 15v6M41 15v6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <path d="m23.5 38 5.2 5.2L41 33" fill="none" stroke="#f4d77a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="boot-title">راصد</div>
        <div class="boot-sub">جارٍ تحضير سجل الغياب…</div>
      </div>
      <div class="spinner" role="status" aria-label="جارٍ التحميل"></div>
    </div>
  </div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript>
    <div style="padding:24px;text-align:center;font-family:Tahoma,sans-serif">
      يحتاج موقع راصد إلى تفعيل JavaScript في المتصفح. يرجى تفعيله ثم إعادة تحميل الصفحة.
    </div>
  </noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
